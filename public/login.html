<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CtrlAccess</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" href="./images/icon.ico" type="image/x-icon">
    
    <style>
        body.login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f8fafc;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .login-logo { margin-bottom: 2rem; }
        .error-message {
            color: #ef4444;
            font-size: 0.875rem;
            margin-top: 1rem;
            min-height: 20px;
        }
    </style>
</head>
<body class="login-page">

    <div class="login-card">
        <img src="./assets/logo.png" alt="CtrlAccess" height="40" class="login-logo">
        
        <form id="loginForm">
            <div class="form-group" style="text-align: left;">
                <label>Usuário</label>
                <input type="text" id="username" class="form-input" placeholder="admin" required>
            </div>
            
            <div class="form-group" style="text-align: left; margin-bottom: 1.5rem;">
                <label>Senha</label>
                <input type="password" id="password" class="form-input" placeholder="••••••" required>
            </div>

            <button type="submit" class="btn" id="btnLogin" style="width: 100%; background: var(--primary); color: white; padding: 10px; font-size: 1rem;">
                Entrar
            </button>
            
            <div id="loginError" class="error-message"></div>
        </form>
    </div>

    <script type="module" src="./js/login.js"></script>
</body>
</html>
