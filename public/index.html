<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CtrlAccess</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" href="./assets/icon.ico" type="image/x-icon">
        
    <script src="/socket.io/socket.io.js"></script>
    
    <script type="module" src="./main.js"></script>
</head>
<body class="app-layout">

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo-text">CtrlAccess</div>
            <button id="btnToggleSidebar" class="btn-toggle">
                <ion-icon name="menu-outline"></ion-icon>
            </button>
        </div>
        
        <nav class="sidebar-nav">
            <ul id="sidebarMenu">
                <li class="nav-item active" data-page="dashboard">
                    <a href="#" class="nav-link">
                        <ion-icon name="grid-outline"></ion-icon>
                        <span class="nav-label">Dashboard</span>
                    </a>
                </li>
            </ul>
        </nav>
    </aside>

    <div class="main-wrapper">
        <header>
            <div class="header-title">
                <img height="30" src="./assets/logo.png" alt="CtrlAccess">
            </div>
            <div style="display: flex; align-items: center; gap: 12px;">
                <button class="emergency-action" id="btnEmergencyAction">
                    <ion-icon name="alert-circle-outline"></ion-icon><span id="emergencyActionText">Emergência</span>
                </button>
                <div class="user-badge" id="userNameDisplay">ADMIN</div>
                <button class="btn-logout" id="btnLogout" title="Sair do Sistema">
                    <ion-icon name="log-out-outline" style="font-size: 1.2rem;"></ion-icon>
                </button>
            </div>
        </header>

        <main id="page-dashboard" class="page-content active-page">
            <section>
                <div class="section-header-wrapper">
                    <h2>
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z">
                            </path>
                        </svg>
                        Dispositivos Conectados
                    </h2>
                    <button class="btn-add" id="btnAddDevice" title="Novo Dispositivo Facial"><ion-icon name="add-outline"></ion-icon></button>
                </div>

                <div class="quick-filters" id="quickFiltersList"></div>

                <div class="search-container">
                    <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <input type="text" id="searchInput" class="search-input"
                        placeholder="Buscar dispositivo, IP ou grupo...">
                </div>

                <div class="devices-wrapper">
                    <div class="devices-list" id="devicesList"></div>
                </div>
            </section>

            <section>
                <div class="schedules-panel">
                    <div class="panel-header">
                        <h2>
                            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            Automação
                            <button id="btnToggleAutomation" class="btn" style="background: #10b981; color: white; padding: 4px 12px; font-size: 0.8rem; border-radius: 20px;">
                                <ion-icon name="power-outline"></ion-icon> <span id="automationStatusText">Ativa</span>
                            </button>
                        </h2>
                        <button class="btn-add" id="btnAddSchedule" title="Novo Horário"><ion-icon name="add-outline"></ion-icon></button>
                    </div>
                    <div class="schedules-list" id="schedulesList"></div>
                </div>
            </section>
        </main>

        <footer>
            <p>CtrlAccess • Desenvolvido por <a href="https://github.com/SebastiaoSoares"
                    target="_blank">SebastiaoSoares</a></p>
        </footer>
    </div>

    <div class="modal-overlay" id="confirmModal">
        <div class="modal-card" style="width: 350px;">
            <h3>Confirmação</h3>
            <p id="confirmMessage" class="confirm-text">Tem certeza que deseja realizar esta ação?</p>
            <div class="modal-actions">
                <button class="btn" style="background: #f1f5f9; color: #64748b;">Cancelar</button>
                <button class="btn" style="background: var(--primary); color: white;">Confirmar</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="scheduleModal">
        <div class="modal-card">
            <h3 id="scheduleModalTitle">Adicionar Nova Regra</h3>
            
            <form id="scheduleForm">
                <input type="hidden" id="editScheduleId">

                <div class="form-group">
                    <label>Título da Regra</label>
                    <input type="text" id="newRuleTitle" class="form-input" placeholder="Ex: Liberar Entrada Manhã" required>
                </div>

                <div class="form-group">
                    <label>Grupo Alvo</label>
                    <select id="newRuleGroupSelect" class="form-input" required></select>
                </div>

                <div class="form-group">
                    <label>Dias da Semana</label>
                    <div class="day-selector" id="daySelector">
                        <div class="day-btn" data-day="0">D</div>
                        <div class="day-btn" data-day="1">S</div>
                        <div class="day-btn" data-day="2">T</div>
                        <div class="day-btn" data-day="3">Q</div>
                        <div class="day-btn" data-day="4">Q</div>
                        <div class="day-btn" data-day="5">S</div>
                        <div class="day-btn" data-day="6">S</div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Horário (Início - Fim)</label>
                    <div class="time-row">
                        <input type="time" id="newRuleTimeStart" class="form-input" required>
                        <span>até</span>
                        <input type="time" id="newRuleTimeEnd" class="form-input" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Ação</label>
                    <select id="newRuleMode" class="form-input">
                        <option value="emergencyMode">Liberar (Porta Aberta)</option>
                        <option value="lockdownMode">Trancar (Bloqueio)</option>
                    </select>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn close-sched-btn" style="background: #f1f5f9; color: #64748b;">Cancelar</button>
                    <button type="submit" id="btnSaveSchedule" class="btn" style="background: var(--primary); color: white;">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="deviceModal">
        <div class="modal-card">
            <h3 id="deviceModalTitle">Novo Dispositivo Facial</h3>
            
            <form id="deviceForm">
                <input type="hidden" name="id" id="editDeviceId" value="">

                <div class="form-group">
                    <label>Nome do Dispositivo</label>
                    <input type="text" name="name" class="form-input" placeholder="Ex: iDFlex - Diretoria" required>
                </div>

                <div class="form-group">
                    <label>Grupo / Setor</label>
                    <input type="text" name="group" list="group-options" class="form-input" placeholder="Ex: Recepção" required autocomplete="off">
                    
                    <datalist id="group-options"></datalist>
                </div>

                <div style="display: flex; gap: 1rem;">
                    <div class="form-group" style="flex: 3;">
                        <label>Endereço IP</label>
                        <input type="text" name="ip" class="form-input" placeholder="Ex: 192.168.1.100" maxlength="15" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Porta</label>
                        <input type="number" name="port" class="form-input" placeholder="80">
                    </div>
                </div>

                <div style="display: flex; gap: 1rem;">
                    <div class="form-group" style="flex: 1;">
                        <label>Usuário</label>
                        <input type="text" name="user" class="form-input" placeholder="admin" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Senha</label>
                        <input type="password" name="pass" class="form-input" placeholder="••••••" required>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn close-btn" style="background: #f1f5f9; color: #64748b;">Cancelar</button>
                    <button type="submit" class="btn" style="background: var(--primary); color: white;">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/phoboslab/jsmpeg@master/jsmpeg.min.js"></script>
    
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>

</html>
