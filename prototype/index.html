<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CtrlAccess</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="/public/icon.ico" type="image/x-icon">
</head>
<body>

    <header>
        <div class="logo">
            <img height="30" src="/public/logo.png" alt="CtrlAccess"><span id="demo">DEMO</span>
        </div>
        <div class="user-badge">Admin</div>
    </header>

    <main>
        <section>
            <div class="section-header-wrapper">
                <h2>
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path></svg>
                    Dispositivos Conectados
                </h2>
                <button class="btn-add" onclick="openDeviceModal()" title="Novo Dispositivo Facial">+</button>
            </div>

            <div class="search-container">
                <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Buscar dispositivo, IP ou grupo...">
            </div>

            <div class="devices-wrapper">
                <div class="devices-list" id="devicesList"></div>
            </div>
        </section>

        <section>
            <div class="schedules-panel">
                <div class="panel-header">
                    <h2>
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Automação
                    </h2>
                    <button class="btn-add" onclick="openScheduleModal()" title="Novo Horário">+</button>
                </div>
                <div class="schedules-list" id="schedulesList"></div>
            </div>
        </section>
    </main>

    <footer>
        <p>CtrlAccess <span id="demo">DEMO</span> • Desenvolvido por <a href="https://github.com/SebastiaoSoares" target="_blank">SebastiaoSoares</a></p>
    </footer>

    <div class="modal-overlay" id="confirmModal">
        <div class="modal-card" style="width: 350px;">
            <h3>Confirmação</h3>
            <p id="confirmMessage" class="confirm-text">Tem certeza que deseja realizar esta ação?</p>
            <div class="modal-actions">
                <button class="btn" style="background: #f1f5f9; color: #64748b;" onclick="closeConfirmModal()">Cancelar</button>
                <button class="btn" style="background: var(--primary); color: white;" onclick="executeAction()">Confirmar</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="scheduleModal">
        <div class="modal-card">
            <h3 id="scheduleModalTitle">Adicionar Nova Regra</h3>
            <input type="hidden" id="editScheduleId">

            <div class="form-group">
                <label>Título da Regra</label>
                <input type="text" id="newRuleTitle" class="form-input" placeholder="Ex: Liberar Entrada Manhã">
            </div>
            
            <div class="form-group">
                <label>Grupo Alvo</label>
                <select id="newRuleGroupSelect" class="form-input"></select>
            </div>

            <div class="form-group">
                <label>Dias da Semana</label>
                <div class="day-selector" id="daySelector">
                    <div class="day-btn" data-day="0">D</div>
                    <div class="day-btn" data-day="1">S</div>
                    <div class="day-btn" data-day="2">T</div>
                    <div class="day-btn" data-day="3">Q</div>
                    <div class="day-btn" data-day="4">Q</div>
                    <div class="day-btn" data-day="5">S</div>
                    <div class="day-btn" data-day="6">S</div>
                </div>
            </div>

            <div class="form-group">
                <label>Horário (Início - Fim)</label>
                <div class="time-row">
                    <input type="time" id="newRuleTimeStart" class="form-input">
                    <span>até</span>
                    <input type="time" id="newRuleTimeEnd" class="form-input">
                </div>
            </div>
            
            <div class="form-group">
                <label>Ação</label>
                <select id="newRuleMode" class="form-input">
                    <option value="emergencyMode">Liberar (Porta Aberta)</option>
                    <option value="lockdownMode">Trancar (Bloqueio)</option>
                </select>
            </div>
            
            <div class="modal-actions">
                <button class="btn" style="background: #f1f5f9; color: #64748b;" onclick="closeScheduleModal()">Cancelar</button>
                <button class="btn" style="background: var(--primary); color: white;" onclick="saveSchedule()">Salvar</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="deviceModal">
        <div class="modal-card">
            <h3 id="deviceModalTitle">Novo Dispositivo Facial</h3>
            <input type="hidden" id="editDeviceId" value="">

            <div class="form-group">
                <label>Nome do Dispositivo</label>
                <input type="text" id="newDeviceName" class="form-input" placeholder="Ex: iDFlex - Diretoria">
            </div>
            
            <div class="form-group">
                <label>Grupo / Setor</label>
                <select id="newDeviceGroupSelect" class="form-input" onchange="toggleGroupInput(this.value)"></select>
                <input type="text" id="newDeviceGroupInput" class="form-input hidden" placeholder="Digite o nome do novo grupo" style="margin-top: 8px;">
            </div>
            
            <div style="display: flex; gap: 1rem;">
                <div class="form-group" style="flex: 3;">
                    <label>Endereço IP</label>
                    <input type="text" id="newDeviceIp" class="form-input" placeholder="Ex: 192.168.1.100" maxlength="15" oninput="maskIP(this)">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Porta</label>
                    <input type="text" id="newDevicePort" class="form-input" placeholder="80" maxlength="5" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
                </div>
            </div>
            
            <div style="display: flex; gap: 1rem;">
                <div class="form-group" style="flex: 1;">
                    <label>Usuário</label>
                    <input type="text" id="newDeviceUser" class="form-input" placeholder="admin">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Senha</label>
                    <input type="password" id="newDevicePass" class="form-input" placeholder="••••••">
                </div>
            </div>

            <div class="modal-actions">
                <button class="btn" style="background: #f1f5f9; color: #64748b;" onclick="closeDeviceModal()">Cancelar</button>
                <button class="btn" style="background: var(--primary); color: white;" onclick="saveDevice()">Salvar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
